apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-access-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: security-access }
  template:
    metadata: { labels: { app: security-access } }
    spec:
      containers:
        - name: app
          image: security-access-management:latest
          ports: [{ containerPort: 5000 }]
          env:
            - name: MONGO_URI
              value: mongodb://mongo:27017/security_access
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: security-access-secrets, key: jwt-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: security-access-service
spec:
  selector: { app: security-access }
  ports: [{ port: 80, targetPort: 5000 }]
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  selector:
    matchLabels: { app: mongo }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: mongo:8
          ports: [{ containerPort: 27017 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: v1
kind: Secret
metadata:
  name: security-access-secrets
type: Opaque
stringData:
  jwt-secret: replace-in-cluster
